<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do</title>
    <link rel="icon" href="imgs/logo.jpg" />
    <link rel="stylesheet" href="tasks.css" />
  </head>
  <body>
    <div class="container">
      <div class="main-up">
        <button id="backBtn">←</button>
        <h2>Today</h2>
        <button class="add-task">Add New</button>
        <input type="text" id="tasks-input" placeholder="Enter your task" />
      </div>

      <div class="main-bottom">
        <h2>My Tasks</h2>
      </div>

      <div class="tasks">
        <ul class="tasks-list"></ul>
      </div>
    </div>
  </body>
  <script src="tasks.js"></script>
</html>
